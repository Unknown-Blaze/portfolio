<rect x="0.5" y="0.5" width="599" height="659" rx="14" fill="url(#grid)" stroke="#D0D7DE"/>
<text x="28" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#0F766E" font-weight="700" letter-spacing="1.6">SYSTEM PLATE · FINAL YEAR PROJECT</text>
<text x="572" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606A" letter-spacing="1.4" text-anchor="end">NTU · 2025–26</text>
