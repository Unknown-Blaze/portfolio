<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="title desc">
<title id="title">MHC-peptide binding prediction pipeline</title>
<desc id="desc">IEDB dataset feeds two branches: a sequence branch with ESM-2 650M fine-tuned with LoRA, and a structure branch with ColabFold/AlphaFold-derived structures turned into graphs for a GNN. An ensemble fuses both to predict binding affinity. PCC 0.859 against 0.847 for the best retrained baseline; submitted to ICLR 2027.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 H0 V20" fill="none" stroke="#E6EAEE" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/></marker></defs>
