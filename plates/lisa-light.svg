<text x="176" y="590" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="1.1">CLOUD COST</text>
<g><rect x="348" y="576" width="232" height="44" fill="#F6F8FA" stroke="#57606A" stroke-width="1"/><path d="M348 598 H580" stroke="#57606A" stroke-width="0.75"/></g>
