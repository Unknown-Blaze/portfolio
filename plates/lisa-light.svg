<text x="165.0" y="308.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">SERVICES</text>
