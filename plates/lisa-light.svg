<text x="165.0" y="206.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">WEB FRONT END</text>
<circle cx="290" cy="270" r="3.2" fill="#C2410C"/>
<path d="M290 270 L330 228 L352 228" fill="none" stroke="#C2410C" stroke-width="1.2"/>
<text x="356" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#C2410C" font-weight="700" letter-spacing="-0.3">300 → 50 ms</text>
<text x="356" y="240" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="1.1">API LATENCY</text>
