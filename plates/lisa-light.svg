<text x="165.0" y="484.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">GROUNDED GENERATION</text>
<path d="M290 469 H338" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="340" y="440" width="210" height="58" rx="6" fill="#E3F1EF" stroke="#0F766E" stroke-width="1.6"/>
<text x="445.0" y="467.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">Answer</text>
<text x="445.0" y="484.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">BACK TO THE USER</text>
<path d="M550 469 H586 V101 H292" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="150" cy="536" r="3.2" fill="#C2410C"/>
