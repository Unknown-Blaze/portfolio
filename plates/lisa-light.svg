<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">LISA 1.0 system plate</title>
<desc id="desc">Users in 4 ASEAN markets use a Next.js 15 app. An API layer backed by PostgreSQL calls retrieval (RAG) over a document store, then an LLM, which returns the answer. Deployed on Alibaba Cloud with Terraform. API latency 300 ms to 50 ms; cloud cost down 70%.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 H0 V20" fill="none" stroke="#E6EAEE" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/></marker></defs>
<rect x="0.5" y="0.5" width="599" height="639" rx="14" fill="#F6F8FA"/>
<rect x="0.5" y="0.5" width="599" height="639" rx="14" fill="url(#grid)" stroke="#D0D7DE"/>
<text x="28" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#0F766E" font-weight="700" letter-spacing="1.6">SYSTEM PLATE · LISA 1.0</text>
<text x="572" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606A" letter-spacing="1.4" text-anchor="end">MISUMI.AI</text>
<path d="M20 48 H580" stroke="#D0D7DE" stroke-width="1"/>
<rect x="40" y="72" width="250" height="58" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.2"/>
<text x="165.0" y="99.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">Users</text>
<text x="165.0" y="116.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">4 ASEAN MARKETS</text>
<path d="M165 130 V160" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="162" width="250" height="58" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.2"/>
