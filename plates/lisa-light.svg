<text x="165.0" y="396.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">TOP-K CONTEXT</text>
<rect x="340" y="352" width="210" height="58" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.2"/>
<text x="445.0" y="379.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" font-weight="600" text-anchor="middle">Document store</text>
<text x="445.0" y="396.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#57606A" letter-spacing="0.9" text-anchor="middle">INDEXED SOURCES</text>
