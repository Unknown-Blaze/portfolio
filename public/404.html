<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sheet not found · Rudra Prasadh Ganesh</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <!-- Served by GitHub Pages for any missing path, so every URL here is absolute. Self-contained: no script, no font files. -->
    <style>
      :root {
        --paper: #f6f8fa;
        --surface: #ffffff;
        --ink: #1f2328;
        --muted: #57606a;
        --teal: #0f766e;
        --amber: #c2410c;
        --line: #d0d7de;
        --grout: rgba(31, 35, 40, 0.045);
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d1117;
          --surface: #161b22;
          --ink: #e6edf3;
          --muted: #9198a1;
          --teal: #2dd4bf;
          --amber: #fbbf24;
          --line: #30363d;
          --grout: rgba(230, 237, 243, 0.035);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--grout) 1px, transparent 1px), linear-gradient(90deg, var(--grout) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--ink);
        font: 16px/1.6 var(--sans);
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: clamp(20px, 5vw, 40px);
      }
      .title-block {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin: 0 0 24px;
        font: 12px/1.4 var(--mono);
        letter-spacing: 0.06em;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .title-block span {
        padding: 6px 10px;
        border-right: 1px solid var(--line);
      }
      .title-block span:last-child {
        border-right: 0;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .code {
        font-family: var(--mono);
        color: var(--amber);
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .dim {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px;
        font: 12px var(--mono);
        color: var(--muted);
      }
      .dim::before,
      .dim::after {
        content: "";
        flex: 1;
        border-top: 1px dashed var(--line);
      }
      a {
        display: inline-block;
        font: 600 14px/1 var(--mono);
        color: var(--paper);
        background: var(--teal);
        padding: 12px 16px;
        border-radius: 4px;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="title-block" aria-hidden="true"><span>SHT 404</span><span>NOT ON THIS DRAWING</span><span>REV —</span></p>
      <h1><span class="code">404</span> · Sheet not found</h1>
      <p>There is no page at this address. It may have moved when the site was redrawn, or the link has a typo.</p>
      <div class="dim" aria-hidden="true">404 → 00</div>
      <a href="/portfolio/">Back to the portfolio</a>
    </main>
  </body>
</html>
