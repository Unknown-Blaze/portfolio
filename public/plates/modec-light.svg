<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Sustainability analytics platform plate</title>
<desc id="desc">IoT sources are ingested through AWS Lambda and S3 into a Django REST Framework backend with a Redis cache, serving a React dashboard. 500+ concurrent requests, retrieval time down 40%, 99.9% uptime.</desc>
