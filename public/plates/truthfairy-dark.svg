<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">Truth Fairy plate</title>
<desc id="desc">A Chrome extension sends page media to a Flask and PyTorch backend running a deepfake classifier; a Grad-CAM heatmap is overlaid back in the page. Top 5 at NTU TechFest.</desc>
